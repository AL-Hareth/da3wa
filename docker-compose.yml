# Local production-like stack: `docker compose up --build`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: da3wa
      POSTGRES_PASSWORD: da3wa
      POSTGRES_DB: da3wa
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U da3wa"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://da3wa:da3wa@db:5432/da3wa
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      - uploads:/app/storage
volumes:
  db:
  uploads:
