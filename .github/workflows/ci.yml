name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: da3wa
          POSTGRES_PASSWORD: da3wa
          POSTGRES_DB: da3wa
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U da3wa" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://da3wa:da3wa@localhost:5432/da3wa
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-00
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      # Build like the Dockerfile does: no database or secrets available at build time.
      - run: pnpm build
        env:
          DATABASE_URL: ""
          AUTH_SECRET: ""
